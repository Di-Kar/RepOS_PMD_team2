name: CI Pipeline

on:
  # CI запускается ТОЛЬКО при pull request в master
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ============================================
  # JOB 1: Проверка линтером wemake-python-styleguide
  # ============================================
  lint:
    name: Lint (wemake-python-styleguide)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wemake-python-styleguide flake8-html Flake8-pyproject

      - name: Run wemake-python-styleguide
        run: |
          # Запуск линтера с сохранением обычного вывода
          flake8 . --tee --output-file=flake8-report.txt || true
          
          # Генерация HTML-отчёта
          flake8 . --format=html --htmldir=flake8-html-report || true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake8-html-report-py${{ matrix.python-version }}
          path: flake8-html-report/
          retention-days: 7

      - name: Fail if lint errors found
        run: |
          if [[ -s flake8-report.txt ]]; then
            echo "❌ Lint errors found:"
            cat flake8-report.txt
            exit 1
          fi

  # ============================================
  # JOB 2: Проверка типов через mypy
  # ============================================
  mypy:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy

      - name: Type check with Mypy
        run: |
          mypy admin_panel
          mypy auth_service
          mypy analytics_etl
          mypy ugc_service
          mypy notification_api
          mypy fulltext_search
          mypy notification_admin_panel

  # ============================================
  # JOB 3: Уведомление в Telegram
  # ============================================
  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [lint, mypy]
    if: always()  # Запускается всегда, даже если предыдущие jobs упали

    steps:
      - name: Determine pipeline status
        id: status
        run: |
          PROJECT_NAME="${{ github.repository }}"
          COMMIT_HASH="${{ github.event.pull_request.head.sha }}"
          COMMIT_SHORT="${COMMIT_HASH:0:7}"
          
          # Определяем статус и упавшие шаги
          FAILED_STEPS=""
          STATUS="successfully"
          
          if [[ "${{ needs.lint.result }}" == "failure" ]]; then
            STATUS="with error"
            FAILED_STEPS="${FAILED_STEPS}• Lint (wemake-python-styleguide) failed\n"
          fi
          
          if [[ "${{ needs.mypy.result }}" == "failure" ]]; then
            STATUS="with error"
            FAILED_STEPS="${FAILED_STEPS}• Type check (mypy) failed\n"
          fi
          
          # Формируем сообщение
          if [[ "$STATUS" == "successfully" ]]; then
            MESSAGE="✅ *${PROJECT_NAME}*: Pipeline for \`${COMMIT_SHORT}\` finished successfully!"
          else
            MESSAGE="❌ *${PROJECT_NAME}*: Pipeline for \`${COMMIT_SHORT}\` finished with error!\n\n${FAILED_STEPS}"
          fi
          
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo -e "$MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: ${{ steps.status.outputs.message }}
