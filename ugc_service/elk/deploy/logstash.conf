input {
  # 1. Прием логов от Docker GELF driver (если Nginx использует driver: gelf)
  gelf {
    port => 5044
    host => "0.0.0.0"
  }

  # 3. Прием логов от Filebeat
  beats {
    port => 5045
    host => "0.0.0.0"
    tags => ["nginx"]
    codec => "json"
    ssl => false
  }
}

filter {  
  if [type] == "gelf" or [input][type] == "gelf" {
    if [container_name] {
      mutate {add_tag => [ "%{container_name}" ]}
    }

    if [tag] {
      mutate { add_tag => [ "%{tag}" ]}
    }
  }

  if "nginx" in [tags] {
    if [message] {
      grok { match => { "message" => "%{COMBINEDAPACHELOG}" }}
    }
  }
  # Здесь можно добавить mutate для преобразования типов, если нужно
  # Например: convert => { "status" => "integer" }
}

output {
  # Проверяем наличие тега "nginx" в массиве tags
  if "nginx" in [tags] {
    elasticsearch {
      hosts => ["${ES_HOST}"]
      index => "nginx-logs-%{+YYYY.MM.dd}" # Рекомендую daily индекс для логов, это стандарт для ILM
    }
  } 

  else if "ugc-api" in [tags] {
    elasticsearch {
      hosts => ["${ES_HOST}"]
      index => "ugc-api-logs-%{+YYYY.MM}"
    }
  }

  else if "elasticsearch" in [tags] {
    elasticsearch {
      hosts => ["${ES_HOST}"]
      index => "elasticsearch-logs-%{+YYYY.MM}"
    }
  }

  else if "kibana" in [tags] {
    elasticsearch {
      hosts => ["${ES_HOST}"]
      index => "kibana-logs-%{+YYYY.MM}"
    }
  }

  else if "filebeat" in [tags] {
    elasticsearch {
      hosts => ["${ES_HOST}"]
      index => "filebeat-logs-%{+YYYY.MM}"
    }
  }

  else if [container_name] {
    elasticsearch {
      hosts => ["${ES_HOST}"]
      index => "container-%{container_name}-logs-%{+YYYY.MM.dd}"
    }
  }
  else {
    elasticsearch {
      hosts => ["${ES_HOST}"]
      index => "app-logs-%{+YYYY.MM.dd}"
    }
  }
}