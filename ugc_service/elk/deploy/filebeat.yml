filebeat.inputs:
- type: container
  paths:
    - '/var/lib/docker/containers/*/*.log'
  # Автоматически добавляем метаданные (имя контейнера, образ и т.д.)
  processors:
    - add_docker_metadata:
        host: "unix:///var/run/docker.sock"

output.logstash:
  hosts: ["logstash:5045"]

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644