volumes:
  static_volume:
  movie_db_data:
  es_data:
  etl_state:
  async_api_redis_data:
  auth_postgres_data:
  auth_redis_data:
  clickhouse_data:
  kafka_data:
  etl_analytics_state:

networks:
  frontend:
  backend:

services:
  # PostgreSQL с контентом кинотеатра (фильмы, жанры, персоны)
  movie_db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./database/database_dump.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - movie_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  # Django-панель администратора
  admin_panel:
    build:
      context: ./admin_panel
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file:
      - ./.env
    volumes:
      - static_volume:/opt/app/static
    depends_on:
      movie_db:
        condition: service_healthy
      auth_service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - backend

  admin_panel_nginx:
    image: nginx:latest
    volumes:
      - ./admin_panel/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./admin_panel/nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/var/www/static:ro
    depends_on:
      - admin_panel
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - frontend

  admin_panel_swagger:
    image: swaggerapi/swagger-ui
    ports:
      - "8080:8080"
    volumes:
      - ./admin_panel/docs/openapi.yaml:/swagger.yaml:ro
    environment:
      SWAGGER_JSON: /swagger.yaml
    depends_on:
      - admin_panel
    restart: unless-stopped
    networks:
      - frontend

  # Redis-кэш для async_api
  async_api_redis:
    image: redis:7-alpine
    container_name: async_api_redis
    # ports:
    #   - "127.0.0.1:6379:6379"
    volumes:
      - async_api_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  # Полнотекстовый поиск для async_api
  elasticsearch:
    image: elasticsearch:8.6.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    # ports:
    #   - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  # ETL: перенос контента из movie_db в Elasticsearch
  fulltext_etl:
    build:
      context: ./fulltext_search
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - etl_state:/app/state
    environment:
      - ETL_STATE_FILE=/app/state/state.json
    depends_on:
      movie_db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  # Асинхронное API кинотеатра (FastAPI + Elasticsearch + Redis)
  async_api:
    build:
      context: ./async_api
      dockerfile: Dockerfile
    image: async-api-image
    container_name: async_api
    env_file:
      - .env
    environment:
      - REDIS_HOST=async_api_redis
    ports:
      - "8000:8000"
    healthcheck:
      # curl в slim-образе нет, проверяем готовность API стандартной библиотекой
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      async_api_redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - backend

  # PostgreSQL сервиса авторизации (пользователи, роли, история входов)
  auth_postgres:
    image: postgres:16-alpine
    container_name: auth_postgres
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  # Redis сервиса авторизации (refresh-сессии, кэш прав)
  auth_redis:
    image: redis:7-alpine
    container_name: auth_redis
    # ports:
    #   - "127.0.0.1:6380:6379"
    volumes:
      - auth_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # Миграции + бутстрап суперпользователя (та же учётка по email, что и
  # bootstrap-админ admin_panel).
  auth_migrations:
    build: ./auth_service
    container_name: auth_migrations
    # command YAML-списком: строкой compose сам делает shell-word-split и
    # съедает вложенные кавычки вокруг $DJANGO_SUPERUSER_*.
    command:
      - sh
      - -c
      - |
        set -e
        alembic upgrade head
        # Бутстрап — best-effort, не должен блокировать старт сервисов.
        set +e
        if [ -n "$$DJANGO_SUPERUSER_EMAIL" ]; then
          python -m src.cli create-superuser "$$DJANGO_SUPERUSER_EMAIL" --password "$$DJANGO_SUPERUSER_PASSWORD" --full-name 'Bootstrap Admin' \
            || echo "WARNING: bootstrap superuser creation failed, continuing anyway"
        fi
        exit 0
    env_file:
      - ./.env
    environment:
      - AUTH_POSTGRES_HOST=auth_postgres
    depends_on:
      auth_postgres:
        condition: service_healthy
    networks:
      - backend

  # Сервис авторизации (FastAPI: /api/v1/auth + /api/v1/idm)
  auth_service:
    build: ./auth_service
    container_name: auth_service
    env_file:
      - ./.env
    environment:
      - AUTH_POSTGRES_HOST=auth_postgres
      - AUTH_REDIS_HOST=auth_redis
    ports:
      - "8001:8000"
    healthcheck:
      # curl в slim-образе нет, проверяем готовность API стандартной библиотекой
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      auth_postgres:
        condition: service_healthy
      auth_redis:
        condition: service_healthy
      auth_migrations:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

  # Трейсинг с помощью Jaeger для observability
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "6831:6831/udp"
      - "16686:16686"
      - "14268:14268"
      - "4317:4317"
      - "4318:4318"
      - "9411:9411"
    restart: unless-stopped
    networks:
      - backend

  # Брокер сообщений для событий пользователей (клики, просмотры, кастомные
  # события) — принимает публикации от event_api, читается ETL в
  # ClickHouse. Single-node KRaft (без Zookeeper). Официальный образ ASF —
  # bitnami/kafka:3.7 вырезан из Docker Hub (Bitnami в 2025 обрезала старые
  # floating-теги, оставив только последние версии).
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      # Топики создаёт kafka_init явно, с нужным числом партиций — без
      # авто-создания по первой записи (это ещё и ловит тайпо в имени топика).
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  # Создаёт топики аналитики сразу при старте стека (one-shot), с нужным
  # числом партиций — вместо ленивого авто-создания по первой записи.
  kafka_init:
    image: apache/kafka:3.7.0
    container_name: kafka_init
    env_file:
      - ./.env
    entrypoint:
      - sh
      - -c
      - |
        set -e
        for topic in "$$EVENTS_KAFKA_TOPIC_CLICKS" "$$EVENTS_KAFKA_TOPIC_PAGEVIEWS" "$$EVENTS_KAFKA_TOPIC_CUSTOM_EVENTS"; do
          echo "Creating topic: $$topic"
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions 3 --replication-factor 1
        done
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend

  # Веб-UI для Kafka: просмотр топиков, сообщений (value/key/headers),
  # consumer groups — удобно смотреть, что реально пишет event_api.
  kafka_ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
      kafka_init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - backend

  # API для сбора пользовательских действий (FastAPI): валидирует события
  # по контракту docs/user_events_contract.md и публикует их в Kafka.
  event_api:
    build:
      context: ./event_api
      dockerfile: Dockerfile
    container_name: event_api
    env_file:
      - ./.env
    environment:
      - EVENTS_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      kafka:
        condition: service_healthy
      kafka_init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

  # ClickHouse — аналитическая БД
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse_init:/docker-entrypoint-initdb.d:ro
    environment:
      - CLICKHOUSE_USER=${ANALYTICS_CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${ANALYTICS_CLICKHOUSE_PASSWORD}
    depends_on:
      - jaeger
    restart: unless-stopped
    networks:
      - backend

  # ETL: Kafka → ClickHouse (analytics)
  analytics_etl:
    build:
      context: ./analytics_etl
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - etl_analytics_state:/app/state
    environment:
      - ANALYTICS_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ANALYTICS_KAFKA_CONSUMER_GROUP=analytics_etl
      - ANALYTICS_KAFKA_TOPICS=analytics.clicks.v1,analytics.pageviews.v1,analytics.custom_events.v1
      - ANALYTICS_CLICKHOUSE_HOST=clickhouse
      - ANALYTICS_CLICKHOUSE_PORT=8123
      - ANALYTICS_CLICKHOUSE_DATABASE=analytics
      - ANALYTICS_CLICKHOUSE_USER=${ANALYTICS_CLICKHOUSE_USER}
      - ANALYTICS_CLICKHOUSE_PASSWORD=${ANALYTICS_CLICKHOUSE_PASSWORD}
      - ANALYTICS_ETL_BATCH_SIZE=1000
      - ANALYTICS_ETL_FLUSH_INTERVAL=5
      - ANALYTICS_ETL_STATE_DIR=/app/state
      - ANALYTICS_ETL_MEMORY_WARN_MB=500
      - ANALYTICS_ETL_MEMORY_CRITICAL_MB=800
      - ANALYTICS_ETL_BACKOFF_START=0.1
      - ANALYTICS_ETL_BACKOFF_BORDER=10.0
      - ANALYTICS_ETL_BACKOFF_MAX=0
    depends_on:
      kafka:
        condition: service_healthy
      kafka_init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

  # Все тесты проекта (tests/): HTTP-тесты async_api, auth_service, event_api
  # (event_api смоук-тесты дополнительно вычитывают Kafka-топики через
  # aiokafka, чтобы подтвердить доставку опубликованных событий)
  # + Django-тесты admin_panel (tests/admin_panel/: AuthServiceBackend) —
  # тому нужен сам Django (ORM, тестовая БД в Postgres), поэтому вдобавок к
  # requirements.txt тестов ставим requirements.txt admin_panel и гоняем
  # manage.py test поверх смонтированного исходника admin_panel.
  tests:
    profiles:
      - tests
    build:
      context: .
      dockerfile: tests/Dockerfile
    container_name: tests
    volumes:
      - ./tests:/tests
      - ./analytics_etl:/analytics_etl
      - ./admin_panel:/admin_panel
    command: sh -c "
      pytest /tests -rs --ignore=/tests/admin_panel
      && cd /admin_panel && python manage.py test /tests/admin_panel"
    environment:
      - PYTHONPATH=/analytics_etl:/
      - REDIS_HOST=async_api_redis
      - API_HOST=async_api
      - AUTH_API_HOST=auth_service
      - EVENT_API_HOST=event_api
      - EVENTS_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ANALYTICS_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ANALYTICS_CLICKHOUSE_HOST=clickhouse
      - ANALYTICS_CLICKHOUSE_PORT=8123
      - ANALYTICS_CLICKHOUSE_NATIVE_PORT=9000
    env_file:
      - ./.env
    depends_on:
      movie_db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      async_api_redis:
        condition: service_healthy
      async_api:
        condition: service_healthy
      auth_service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka_init:
        condition: service_completed_successfully
      event_api:
        condition: service_healthy
      kafka_ui:
        condition: service_started
      clickhouse:
        condition: service_started
      analytics_etl:
        condition: service_started
    networks:
      - backend