volumes:
  static_volume:
  movie_db_data:
  es_data:
  etl_state:
  async_api_redis_data:
  auth_postgres_data:
  auth_redis_data:
  clickhouse_data:
  kafka_data:
  etl_analytics_state:
  notification_postgres_data:
  notification_static_volume:
  # MongoDB Cluster data
  mongo_config_data_0:
  mongo_config_data_1:
  mongo_config_data_2:
  mongo_shard1_data_0:
  mongo_shard1_data_1:
  mongo_shard1_data_2:
  mongo_shard2_data_0:
  mongo_shard2_data_1:
  mongo_shard2_data_2:

networks:
  frontend:
  backend:

services:
  # PostgreSQL с контентом кинотеатра (фильмы, жанры, персоны)
  movie_db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./database/database_dump.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - movie_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  # Django-панель администратора
  admin_panel:
    build:
      context: ./admin_panel
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file:
      - ./.env
    environment:
      - SENTRY_DSN=${SENTRY_DSN_ADMIN_PANEL}
    volumes:
      - static_volume:/opt/app/static
    depends_on:
      movie_db:
        condition: service_healthy
      auth_service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - backend

  admin_panel_nginx:
    image: nginx:latest
    volumes:
      - ./admin_panel/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./admin_panel/nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/var/www/static:ro
    depends_on:
      - admin_panel
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - frontend

  admin_panel_swagger:
    image: swaggerapi/swagger-ui
    ports:
      - "8080:8080"
    volumes:
      - ./admin_panel/docs/openapi.yaml:/swagger.yaml:ro
    environment:
      SWAGGER_JSON: /swagger.yaml
    depends_on:
      - admin_panel
    restart: unless-stopped
    networks:
      - frontend

  # Redis-кэш для async_api
  async_api_redis:
    image: redis:7-alpine
    container_name: async_api_redis
    # ports:
    #   - "127.0.0.1:6379:6379"
    volumes:
      - async_api_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  # Полнотекстовый поиск для async_api
  elasticsearch:
    image: elasticsearch:8.6.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    # ports:
    #   - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  # ETL: перенос контента из movie_db в Elasticsearch
  fulltext_etl:
    build:
      context: ./fulltext_search
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - etl_state:/app/state
    environment:
      - ETL_STATE_FILE=/app/state/state.json
    depends_on:
      movie_db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  # Асинхронное API кинотеатра (FastAPI + Elasticsearch + Redis)
  async_api:
    build:
      context: ./async_api
      dockerfile: Dockerfile
    image: async-api-image
    container_name: async_api
    env_file:
      - .env
    environment:
      - REDIS_HOST=async_api_redis
      - SENTRY_DSN=${SENTRY_DSN_ASYNC_API}
    ports:
      - "8000:8000"
    healthcheck:
      # curl в slim-образе нет, проверяем готовность API стандартной библиотекой
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      async_api_redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - backend

  # PostgreSQL сервиса авторизации (пользователи, роли, история входов)
  auth_postgres:
    image: postgres:16-alpine
    container_name: auth_postgres
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  # Redis сервиса авторизации (refresh-сессии, кэш прав)
  auth_redis:
    image: redis:7-alpine
    container_name: auth_redis
    # ports:
    #   - "127.0.0.1:6380:6379"
    volumes:
      - auth_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # Миграции + бутстрап суперпользователя (та же учётка по email, что и
  # bootstrap-админ admin_panel).
  auth_migrations:
    build: ./auth_service
    container_name: auth_migrations
    # command YAML-списком: строкой compose сам делает shell-word-split и
    # съедает вложенные кавычки вокруг $DJANGO_SUPERUSER_*.
    command:
      - sh
      - -c
      - |
        set -e
        alembic upgrade head
        # Бутстрап — best-effort, не должен блокировать старт сервисов.
        set +e
        if [ -n "$$DJANGO_SUPERUSER_EMAIL" ]; then
          python -m src.cli create-superuser "$$DJANGO_SUPERUSER_EMAIL" --password "$$DJANGO_SUPERUSER_PASSWORD" --full-name 'Bootstrap Admin' \
            || echo "WARNING: bootstrap superuser creation failed, continuing anyway"
        fi
        exit 0
    env_file:
      - ./.env
    environment:
      - AUTH_POSTGRES_HOST=auth_postgres
    depends_on:
      auth_postgres:
        condition: service_healthy
    networks:
      - backend

  # Сервис авторизации (FastAPI: /api/v1/auth + /api/v1/idm)
  auth_service:
    build: ./auth_service
    container_name: auth_service
    env_file:
      - ./.env
    environment:
      - AUTH_POSTGRES_HOST=auth_postgres
      - AUTH_REDIS_HOST=auth_redis
      - SENTRY_DSN=${SENTRY_DSN_AUTH_SERVICE}
    ports:
      - "8001:8000"
    healthcheck:
      # curl в slim-образе нет, проверяем готовность API стандартной библиотекой
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      auth_postgres:
        condition: service_healthy
      auth_redis:
        condition: service_healthy
      auth_migrations:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

  # Трейсинг с помощью Jaeger для observability
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "6831:6831/udp"
      - "16686:16686"
      - "14268:14268"
      - "4317:4317"
      - "4318:4318"
      - "9411:9411"
    restart: unless-stopped
    networks:
      - backend

  # Брокер сообщений для событий пользователей (клики, просмотры, кастомные
  # события) — принимает публикации от event_api, читается ETL в
  # ClickHouse. Single-node KRaft (без Zookeeper). Официальный образ ASF —
  # bitnami/kafka:3.7 вырезан из Docker Hub (Bitnami в 2025 обрезала старые
  # floating-теги, оставив только последние версии).
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      # Топики создаёт kafka_init явно, с нужным числом партиций — без
      # авто-создания по первой записи (это ещё и ловит тайпо в имени топика).
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  # Создаёт топики аналитики сразу при старте стека (one-shot), с нужным
  # числом партиций — вместо ленивого авто-создания по первой записи.
  kafka_init:
    image: apache/kafka:3.7.0
    container_name: kafka_init
    env_file:
      - ./.env
    entrypoint:
      - sh
      - -c
      - |
        set -e
        for topic in "$$EVENTS_KAFKA_TOPIC_CLICKS" "$$EVENTS_KAFKA_TOPIC_PAGEVIEWS" "$$EVENTS_KAFKA_TOPIC_CUSTOM_EVENTS" "$$NOTIFICATIONS_KAFKA_TOPIC_REQUESTS" "$$NOTIFICATION_WORKER_KAFKA_TOPIC_READY"; do
          echo "Creating topic: $$topic"
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions 3 --replication-factor 1
        done
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend

  # Веб-UI для Kafka: просмотр топиков, сообщений (value/key/headers),
  # consumer groups — удобно смотреть, что реально пишет event_api.
  kafka_ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
      kafka_init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - backend

  # API для сбора пользовательских действий (FastAPI): валидирует события
  # по контракту docs/user_events_contract.md и публикует их в Kafka.
  event_api:
    build:
      context: ./event_api
      dockerfile: Dockerfile
    container_name: event_api
    env_file:
      - ./.env
    environment:
      - EVENTS_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PYTHONPATH=/opt/app/shared
      - SENTRY_DSN=${SENTRY_DSN_EVENT_API}
    volumes:
      - ./shared:/opt/app/shared:ro
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      kafka:
        condition: service_healthy
      kafka_init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

  # Миграции notification_api (alembic upgrade head) — по образцу
  # auth_migrations. Без этого шага таблица notification_log (§9 контракта)
  # никогда не создаётся, и запись лога молча падает (best-effort, не роняет
  # HTTP-ответ notification_api).
  notification_migrations:
    build:
      context: ./notification_api
      dockerfile: Dockerfile
    container_name: notification_migrations
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ./.env
    depends_on:
      notification_postgres:
        condition: service_healthy
    networks:
      - backend

  # API приёма заявок на уведомления (FastAPI): валидирует заявки по
  # контракту docs/notification_requests_contract.md, разворачивает
  # получателей и публикует в Kafka. Сам не рендерит и не отправляет —
  # доставка email (notification_worker_render/_email_sender, S10_T3) —
  # отдельные сервисы ниже.
  notification_api:
    build:
      context: ./notification_api
      dockerfile: Dockerfile
    container_name: notification_api
    env_file:
      - ./.env
    environment:
      - NOTIFICATIONS_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SENTRY_DSN=${SENTRY_DSN_NOTIFICATION_API}
      - PYTHONPATH=/opt/app/shared
    volumes:
      - ./shared:/opt/app/shared:ro
    ports:
      - "8004:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      kafka:
        condition: service_healthy
      kafka_init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
      notification_postgres:
        condition: service_healthy
      notification_migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - backend

  # SMTP-мок для локальной разработки и тестов notification_worker — письма
  # никуда не уходят наружу, видны через HTTP API/UI на 8025.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    ports:
      - "8025:8025"
    restart: unless-stopped
    networks:
      - backend

  # Разовая миграция notification_worker: своя таблица notification_worker_dlq
  # в той же notification_postgres (см. notification_worker/scripts/migrate.py) —
  # по образцу notification_migrations, но идемпотентный DDL-скрипт вместо
  # Alembic: заводить третью систему миграций поверх той же физической БД
  # (Alembic у notification_api, Django-миграции у notification_admin_panel)
  # ради одной таблицы избыточно.
  notification_worker_migrations:
    build:
      context: ./notification_worker
      dockerfile: Dockerfile
    container_name: notification_worker_migrations
    command: ["python", "scripts/migrate.py"]
    env_file:
      - ./.env
    depends_on:
      notification_postgres:
        condition: service_healthy
    networks:
      - backend

  # Воркер-рендерер (S10_T3, issue #96): читает notifications.requests.v1,
  # обогащает профилем из auth_service (internal endpoint, без JWT — к
  # воркеру приходит только user_id), рендерит шаблон, публикует готовый
  # текст в notifications.ready.v1. Сам письма не отправляет — см. §0
  # контракта и docs/notification_requests_contract.md.
  notification_worker_render:
    build:
      context: ./notification_worker
      dockerfile: Dockerfile
    container_name: notification_worker_render
    command: ["python", "-m", "src.main_render"]
    env_file:
      - ./.env
    environment:
      - NOTIFICATION_WORKER_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SENTRY_DSN=${SENTRY_DSN_NOTIFICATION_WORKER}
      - PYTHONPATH=/opt/app/shared
    volumes:
      - ./shared:/opt/app/shared:ro
    depends_on:
      kafka:
        condition: service_healthy
      kafka_init:
        condition: service_completed_successfully
      notification_postgres:
        condition: service_healthy
      notification_migrations:
        condition: service_completed_successfully
      notification_worker_migrations:
        condition: service_completed_successfully
      auth_service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  # Воркер-отправитель email (S10_T3, issue #96): читает notifications.ready.v1,
  # фильтрует channel="email", идемпотентно отправляет письмо (проверяет
  # текущий статус перед отправкой — ределивери не должен дублировать
  # письмо), обновляет notification_log/notifications/notification_history.
  # Независимый от рендера consumer group — своё горизонтальное
  # масштабирование (docker compose up --scale notification_worker_email_sender=N),
  # не блокируется медленным auth_service/Postgres на рендер-стадии.
  notification_worker_email_sender:
    build:
      context: ./notification_worker
      dockerfile: Dockerfile
    container_name: notification_worker_email_sender
    command: ["python", "-m", "src.main_send_email"]
    env_file:
      - ./.env
    environment:
      - NOTIFICATION_WORKER_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SENTRY_DSN=${SENTRY_DSN_NOTIFICATION_WORKER}
      - PYTHONPATH=/opt/app/shared
    volumes:
      - ./shared:/opt/app/shared:ro
    depends_on:
      kafka:
        condition: service_healthy
      kafka_init:
        condition: service_completed_successfully
      notification_postgres:
        condition: service_healthy
      notification_migrations:
        condition: service_completed_successfully
      notification_worker_migrations:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

  # ClickHouse — аналитическая БД
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse_init:/docker-entrypoint-initdb.d:ro
    environment:
      - CLICKHOUSE_USER=${ANALYTICS_CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${ANALYTICS_CLICKHOUSE_PASSWORD}
    depends_on:
      - jaeger
    restart: unless-stopped
    networks:
      - backend

  # ETL: Kafka → ClickHouse (analytics)
  analytics_etl:
    build:
      context: ./analytics_etl
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - etl_analytics_state:/app/state
      - ./shared:/app/shared:ro
    environment:
      - PYTHONPATH=/app/shared
      - ANALYTICS_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ANALYTICS_KAFKA_CONSUMER_GROUP=analytics_etl
      - ANALYTICS_KAFKA_TOPICS=analytics.clicks.v1,analytics.pageviews.v1,analytics.custom_events.v1
      - ANALYTICS_CLICKHOUSE_HOST=clickhouse
      - ANALYTICS_CLICKHOUSE_PORT=8123
      - ANALYTICS_CLICKHOUSE_DATABASE=analytics
      - ANALYTICS_CLICKHOUSE_USER=${ANALYTICS_CLICKHOUSE_USER}
      - ANALYTICS_CLICKHOUSE_PASSWORD=${ANALYTICS_CLICKHOUSE_PASSWORD}
      - ANALYTICS_ETL_BATCH_SIZE=1000
      - ANALYTICS_ETL_FLUSH_INTERVAL=5
      - ANALYTICS_ETL_STATE_DIR=/app/state
      - ANALYTICS_ETL_MEMORY_WARN_MB=500
      - ANALYTICS_ETL_MEMORY_CRITICAL_MB=800
      - ANALYTICS_ETL_BACKOFF_START=0.1
      - ANALYTICS_ETL_BACKOFF_BORDER=10.0
      - ANALYTICS_ETL_BACKOFF_MAX=0
    depends_on:
      kafka:
        condition: service_healthy
      kafka_init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

  # ============================================================================
  #  Notification Admin Panel (Django) + PostgreSQL + Cron
  # ============================================================================

  # База данных для админ-панели уведомлений
  notification_postgres:
    image: postgres:15-alpine
    container_name: notification_postgres
    environment:
      POSTGRES_USER: ${NOTIFICATION_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD}
      POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB}
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  # Django-приложение: Административная панель уведомлений
  notification_admin_panel:
    build:
      context: ./notification_admin_panel  
      dockerfile: Dockerfile
    container_name: notification_admin_panel
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgres://${NOTIFICATION_POSTGRES_USER:-notify_user}:${NOTIFICATION_POSTGRES_PASSWORD:-notify_secret}@notification_postgres:5432/${NOTIFICATION_POSTGRES_DB:-notifications_db}
      - DJANGO_SETTINGS_MODULE=notification_admin.settings
      - NOTIFICATION_API_URL=http://notification_api:8000
      - NOTIFICATION_API_KEY=${NOTIFICATION_API_KEY}
      - NOTIFICATION_API_TIMEOUT=10
    volumes:
      - ./notification_admin_panel:/opt/app  # ВАЖНО: монтируем код для hot-reload
      - notification_static_volume:/opt/app/staticfiles
    ports:
      - "8005:8000"
    depends_on:
      notification_postgres:
        condition: service_healthy
      notification_api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
      - frontend  # Добавлено, если нужен прямой доступ к UI без Nginx

  # Cron-воркер для обработки отложенных и повторяющихся рассылок
  notification_admin_cron:
    build:
      context: ./notification_admin_panel
      dockerfile: Dockerfile.cron
    container_name: notification_admin_cron
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgres://${NOTIFICATION_POSTGRES_USER:-notify_user}:${NOTIFICATION_POSTGRES_PASSWORD:-notify_secret}@notification_postgres:5432/${NOTIFICATION_POSTGRES_DB:-notifications_db}
      - DJANGO_SETTINGS_MODULE=notification_admin.settings
      - NOTIFICATION_API_URL=http://notification_api:8000
      - NOTIFICATION_API_KEY=${NOTIFICATION_API_KEY}
      - NOTIFICATION_API_TIMEOUT=10
    depends_on:
      notification_postgres:
        condition: service_healthy
      notification_api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

# ============================================================================ #
#  MongoDB Cluster (11 контейнеров: 2 шарда × 3 реплики + 3 config + 2 mongos) #
# ============================================================================ #

  # --- Config Servers (реплика сет "config") ---
  mongo_config-0:
    image: mongo:6.0
    container_name: mongo_config-0
    command: mongod --configsvr --replSet config --dbpath /data/db --port 27017 --bind_ip_all
    expose:
      - "27017"
    volumes:
      - mongo_config_data_0:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--host", "localhost:27017", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

  mongo_config-1:
    image: mongo:6.0
    container_name: mongo_config-1
    command: mongod --configsvr --replSet config --dbpath /data/db --port 27017 --bind_ip_all
    expose:
      - "27017"
    volumes:
      - mongo_config_data_1:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--host", "localhost:27017", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

  mongo_config-2:
    image: mongo:6.0
    container_name: mongo_config-2
    command: mongod --configsvr --replSet config --dbpath /data/db --port 27017 --bind_ip_all
    expose:
      - "27017"
    volumes:
      - mongo_config_data_2:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--host", "localhost:27017", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

  # --- Shard 1 Replica Set ---
  mongo_shard1-0:
    image: mongo:6.0
    container_name: mongo_shard1-0
    command: mongod --shardsvr --replSet shard1 --dbpath /data/db --port 27017 --bind_ip_all
    expose:
      - "27017"
    volumes:
      - mongo_shard1_data_0:/data/db
    networks:
      - backend
    restart: unless-stopped

  mongo_shard1-1:
    image: mongo:6.0
    container_name: mongo_shard1-1
    command: mongod --shardsvr --replSet shard1 --dbpath /data/db --port 27017 --bind_ip_all
    expose:
      - "27017"
    volumes:
      - mongo_shard1_data_1:/data/db
    networks:
      - backend
    restart: unless-stopped

  mongo_shard1-2:
    image: mongo:6.0
    container_name: mongo_shard1-2
    command: mongod --shardsvr --replSet shard1 --dbpath /data/db --port 27017 --bind_ip_all
    expose:
      - "27017"
    volumes:
      - mongo_shard1_data_2:/data/db
    networks:
      - backend
    restart: unless-stopped

  # --- Shard 2 Replica Set ---
  mongo_shard2-0:
    image: mongo:6.0
    container_name: mongo_shard2-0
    command: mongod --shardsvr --replSet shard2 --dbpath /data/db --port 27017 --bind_ip_all
    expose:
      - "27017"
    volumes:
      - mongo_shard2_data_0:/data/db
    networks:
      - backend
    restart: unless-stopped

  mongo_shard2-1:
    image: mongo:6.0
    container_name: mongo_shard2-1
    command: mongod --shardsvr --replSet shard2 --dbpath /data/db --port 27017 --bind_ip_all
    expose:
      - "27017"
    volumes:
      - mongo_shard2_data_1:/data/db
    networks:
      - backend
    restart: unless-stopped

  mongo_shard2-2:
    image: mongo:6.0
    container_name: mongo_shard2-2
    command: mongod --shardsvr --replSet shard2 --dbpath /data/db --port 27017 --bind_ip_all
    expose:
      - "27017"
    volumes:
      - mongo_shard2_data_2:/data/db
    networks:
      - backend
    restart: unless-stopped

  # --- Mongos Routers ---
  mongo_mongos-0:
    image: mongo:6.0
    container_name: mongo_mongos-0
    command: mongos --configdb config/mongo_config-0:27017,mongo_config-1:27017,mongo_config-2:27017 --port 27017 --bind_ip 0.0.0.0
    expose:
      - "27017"
    ports:
      - "127.0.0.1:27017:27017"
    depends_on:
      mongo_config-0:
        condition: service_started
      mongo_config-1:
        condition: service_started
      mongo_config-2:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped

  mongo_mongos-1:
    image: mongo:6.0
    container_name: mongo_mongos-1
    command: mongos --configdb config/mongo_config-0:27017,mongo_config-1:27017,mongo_config-2:27017 --port 27017 --bind_ip 0.0.0.0
    expose:
      - "27017"
    ports:
      - "127.0.0.1:27018:27017"
    depends_on:
      mongo_config-0:
        condition: service_started
      mongo_config-1:
        condition: service_started
      mongo_config-2:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped

  # --- MongoDB Cluster Initialization (one-shot) ---
  mongo_init:
    image: mongo:6.0
    container_name: mongo_init
    env_file:
      - ./.env
    depends_on:
      mongo_mongos-0:
        condition: service_started
      mongo_mongos-1:
        condition: service_started
    entrypoint:
      - sh
      - -c
      - |
        set -e
        echo "Initializing config replica set..."
        mongosh --host mongo_config-0:27017 --eval '
          rs.initiate({
            _id: "config",
            configsvr: true,
            members: [
              { _id: 0, host: "mongo_config-0:27017" },
              { _id: 1, host: "mongo_config-1:27017" },
              { _id: 2, host: "mongo_config-2:27017" }
            ]
          })
        ' 2>/dev/null || echo "Config replica set already initialized"

        echo "Initializing shard1 replica set..."
        mongosh --host mongo_shard1-0:27017 --eval '
          rs.initiate({
            _id: "shard1",
            members: [
              { _id: 0, host: "mongo_shard1-0:27017" },
              { _id: 1, host: "mongo_shard1-1:27017" },
              { _id: 2, host: "mongo_shard1-2:27017" }
            ]
          })
        ' 2>/dev/null || echo "Shard1 replica set already initialized"

        echo "Initializing shard2 replica set..."
        mongosh --host mongo_shard2-0:27017 --eval '
          rs.initiate({
            _id: "shard2",
            members: [
              { _id: 0, host: "mongo_shard2-0:27017" },
              { _id: 1, host: "mongo_shard2-1:27017" },
              { _id: 2, host: "mongo_shard2-2:27017" }
            ]
          })
        ' 2>/dev/null || echo "Shard2 replica set already initialized"

        echo "Waiting for all primaries to be elected (up to 90s)..."
        for i in $$(seq 1 45); do
          CONFIG_PRIMARY=$$(mongosh --host mongo_config-0:27017 --quiet --eval "print(rs.isMaster().ismaster)" 2>/dev/null || echo "false")
          SHARD1_PRIMARY=$$(mongosh --host mongo_shard1-0:27017 --quiet --eval "print(rs.isMaster().ismaster)" 2>/dev/null || echo "false")
          SHARD2_PRIMARY=$$(mongosh --host mongo_shard2-0:27017 --quiet --eval "print(rs.isMaster().ismaster)" 2>/dev/null || echo "false")
          if [ "$$CONFIG_PRIMARY" = "true" ] && [ "$$SHARD1_PRIMARY" = "true" ] && [ "$$SHARD2_PRIMARY" = "true" ]; then
            echo "All primaries elected!"
            break
          fi
          if [ $$(($$i % 10)) -eq 0 ]; then
            echo "Waiting for primaries... ($$i/45)"
          fi
          sleep 2
        done

        echo "Waiting for mongos to be ready (up to 180s)..."
        for i in $$(seq 1 90); do
          if mongosh --host mongo_mongos-0:27017 --eval "db.adminCommand('ping')" >/dev/null 2>&1; then
            echo "Mongos is ready!"
            break
          fi
          if [ $$(($$i % 10)) -eq 0 ]; then
            echo "Waiting for mongos... ($$i/90)"
          fi
          sleep 2
        done

        echo "Creating MongoDB users..."
        # Create root user in admin database (no auth yet)
        mongosh --host mongo_mongos-0:27017 --eval '
          db.getSiblingDB("admin").createUser({
            user: "'"$MONGO_ROOT_USER"'",
            pwd: "'"$MONGO_ROOT_PASSWORD"'",
            roles: [{ role: "root", db: "admin" }]
          })
        ' 2>/dev/null || echo "Root user already exists"

        # Create ugc_service user with readWrite access to ugc_service database (now using root auth)
        mongosh --host mongo_mongos-0:27017 -u "$$MONGO_ROOT_USER" -p "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --eval '
          db.getSiblingDB("admin").createUser({
            user: "'"$MONGO_UGC_USER"'",
            pwd: "'"$MONGO_UGC_PASSWORD"'",
            roles: [
              { role: "readWrite", db: "ugc_service" },
              { role: "dbAdmin", db: "ugc_service" }
            ]
          })
        ' 2>/dev/null || echo "ugc_service user already exists"

        echo "Adding shards to cluster..."
        mongosh --host mongo_mongos-0:27017 -u "$$MONGO_ROOT_USER" -p "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --eval '
          sh.addShard("shard1/mongo_shard1-0:27017,mongo_shard1-1:27017,mongo_shard1-2:27017");
          sh.addShard("shard2/mongo_shard2-0:27017,mongo_shard2-1:27017,mongo_shard2-2:27017");
        '

        echo "Enabling sharding for database ugc_service..."
        mongosh --host mongo_mongos-0:27017 -u "$$MONGO_ROOT_USER" -p "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --eval '
          sh.enableSharding("ugc_service");
        '

        # Ждём инициализации sharding для базы данных
        echo "Waiting for sharding to initialize..."
        sleep 5

        echo "Setting shard keys..."
        mongosh --host mongo_mongos-0:27017 -u "$$MONGO_ROOT_USER" -p "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --eval '
          sh.shardCollection("ugc_service.bookmarks", { user_id: "hashed" });
          sh.shardCollection("ugc_service.likes", { user_id: "hashed" });
          sh.shardCollection("ugc_service.reviews", { film_id: 1 });
          sh.shardCollection("ugc_service.review_votes", { review_id: 1 });
        '

        echo "MongoDB cluster initialization complete!"
    networks:
      - backend

  # --- ugc_service ---
  ugc_service:
    build:
      context: ./ugc_service
      dockerfile: Dockerfile
    container_name: ugc_service
    env_file:
      - ./.env
    environment:
      - MONGO_URI=mongodb://${MONGO_UGC_USER}:${MONGO_UGC_PASSWORD}@mongo_mongos-0:27017,mongo_mongos-1:27017/ugc_service?authSource=admin
      - MONGO_DB=ugc_service
      - AUTH_SERVICE_URL=http://auth_service:8000/api/v1/auth
      - SENTRY_DSN=${SENTRY_DSN_UGC_SERVICE}
    ports:
      - "8003:8000"
    depends_on:
      mongo_mongos-0:
        condition: service_started
      mongo_init:
        condition: service_completed_successfully
      auth_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  # Все тесты проекта (tests/): HTTP-тесты async_api, auth_service, event_api,
  # notification_api (event_api и notification_api смоук-тесты дополнительно
  # вычитывают Kafka-топики через aiokafka, чтобы подтвердить доставку
  # опубликованных событий/заявок)
  # + Django-тесты admin_panel (tests/admin_panel/: AuthServiceBackend) —
  # тому нужен сам Django (ORM, тестовая БД в Postgres), поэтому вдобавок к
  # requirements.txt тестов ставим requirements.txt admin_panel и гоняем
  # manage.py test поверх смонтированного исходника admin_panel.
  tests:
    profiles:
      - tests
    build:
      context: .
      dockerfile: tests/Dockerfile
    container_name: tests
    volumes:
      - ./tests:/tests
      - ./analytics_etl:/analytics_etl
      - ./admin_panel:/admin_panel
      - ./notification_admin_panel:/notification_admin_panel
      - ./shared:/shared
      - ./ugc_service:/ugc_service
    command: sh -c "
      pytest /tests -rs --ignore=/tests/admin_panel --ignore=/tests/notification_admin_panel --import-mode=importlib
      && cd /admin_panel && python manage.py test /tests/admin_panel
      && cd /notification_admin_panel && python manage.py test tests.notification_admin_panel"
    environment:
      - PYTHONPATH=/analytics_etl/src:/ugc_service/src:/tests:/shared:/
      - REDIS_HOST=async_api_redis
      - API_HOST=async_api
      - AUTH_API_HOST=auth_service
      - EVENT_API_HOST=event_api
      - UGC_API_HOST=ugc_service
      - UGC_API_PORT=8000
      - NOTIFICATION_API_HOST=notification_api
      - EVENTS_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - NOTIFICATIONS_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - NOTIFICATION_WORKER_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MAILHOG_HOST=mailhog
      - ANALYTICS_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ANALYTICS_CLICKHOUSE_HOST=clickhouse
      - ANALYTICS_CLICKHOUSE_PORT=8123
      - ANALYTICS_CLICKHOUSE_NATIVE_PORT=9000
      - MONGO_URI=mongodb://${MONGO_UGC_USER}:${MONGO_UGC_PASSWORD}@mongo_mongos-0:27017,mongo_mongos-1:27017/ugc_service?authSource=admin
    env_file:
      - ./.env
    depends_on:
      movie_db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      async_api_redis:
        condition: service_healthy
      async_api:
        condition: service_healthy
      auth_service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka_init:
        condition: service_completed_successfully
      event_api:
        condition: service_healthy
      notification_api:
        condition: service_healthy
      notification_worker_render:
        condition: service_started
      notification_worker_email_sender:
        condition: service_started
      mailhog:
        condition: service_started
      kafka_ui:
        condition: service_started
      clickhouse:
        condition: service_started
      analytics_etl:
        condition: service_started
      ugc_service:
        condition: service_healthy
      mongo_init:
        condition: service_completed_successfully
    networks:
      - backend