volumes:
  static_volume:
  movie_db_data:
  es_data:
  etl_state:
  async_api_redis_data:
  auth_postgres_data:
  auth_redis_data:

networks:
  frontend:
  backend:

services:
  # PostgreSQL с контентом кинотеатра (фильмы, жанры, персоны)
  movie_db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./database/database_dump.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - movie_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  # Django-панель администратора
  admin_panel:
    build:
      context: ./admin_panel
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file:
      - ./.env
    volumes:
      - static_volume:/opt/app/static
    depends_on:
      movie_db:
        condition: service_healthy
      auth_service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - backend

  admin_panel_nginx:
    image: nginx:latest
    volumes:
      - ./admin_panel/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./admin_panel/nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/var/www/static:ro
    depends_on:
      - admin_panel
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - frontend

  admin_panel_swagger:
    image: swaggerapi/swagger-ui
    ports:
      - "8080:8080"
    volumes:
      - ./admin_panel/docs/openapi.yaml:/swagger.yaml:ro
    environment:
      SWAGGER_JSON: /swagger.yaml
    depends_on:
      - admin_panel
    restart: unless-stopped
    networks:
      - frontend

  # Redis-кэш для async_api
  async_api_redis:
    image: redis:7-alpine
    container_name: async_api_redis
    # ports:
    #   - "127.0.0.1:6379:6379"
    volumes:
      - async_api_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  # Полнотекстовый поиск для async_api
  elasticsearch:
    image: elasticsearch:8.6.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    # ports:
    #   - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  # ETL: перенос контента из movie_db в Elasticsearch
  fulltext_etl:
    build:
      context: ./fulltext_search
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - etl_state:/app/state
    environment:
      - ETL_STATE_FILE=/app/state/state.json
    depends_on:
      movie_db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  # Асинхронное API кинотеатра (FastAPI + Elasticsearch + Redis)
  async_api:
    build:
      context: ./async_api
      dockerfile: Dockerfile
    image: async-api-image
    container_name: async_api
    env_file:
      - .env
    environment:
      - REDIS_HOST=async_api_redis
    ports:
      - "8000:8000"
    healthcheck:
      # curl в slim-образе нет, проверяем готовность API стандартной библиотекой
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      async_api_redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - backend

  # PostgreSQL сервиса авторизации (пользователи, роли, история входов)
  auth_postgres:
    image: postgres:16-alpine
    container_name: auth_postgres
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  # Redis сервиса авторизации (refresh-сессии, кэш прав)
  auth_redis:
    image: redis:7-alpine
    container_name: auth_redis
    # ports:
    #   - "127.0.0.1:6380:6379"
    volumes:
      - auth_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # Миграции + бутстрап суперпользователя (та же учётка по email, что и
  # bootstrap-админ admin_panel).
  auth_migrations:
    build: ./auth_service
    container_name: auth_migrations
    # command YAML-списком: строкой compose сам делает shell-word-split и
    # съедает вложенные кавычки вокруг $DJANGO_SUPERUSER_*.
    command:
      - sh
      - -c
      - |
        set -e
        alembic upgrade head
        # Бутстрап — best-effort, не должен блокировать старт сервисов.
        set +e
        if [ -n "$$DJANGO_SUPERUSER_EMAIL" ]; then
          python -m src.cli create-superuser "$$DJANGO_SUPERUSER_EMAIL" --password "$$DJANGO_SUPERUSER_PASSWORD" --full-name 'Bootstrap Admin' \
            || echo "WARNING: bootstrap superuser creation failed, continuing anyway"
        fi
        exit 0
    env_file:
      - ./.env
    environment:
      - AUTH_POSTGRES_HOST=auth_postgres
    depends_on:
      auth_postgres:
        condition: service_healthy
    networks:
      - backend

  # Сервис авторизации (FastAPI: /api/v1/auth + /api/v1/idm)
  auth_service:
    build: ./auth_service
    container_name: auth_service
    env_file:
      - ./.env
    environment:
      - AUTH_POSTGRES_HOST=auth_postgres
      - AUTH_REDIS_HOST=auth_redis
    ports:
      - "8001:8000"
    healthcheck:
      # curl в slim-образе нет, проверяем готовность API стандартной библиотекой
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      auth_postgres:
        condition: service_healthy
      auth_redis:
        condition: service_healthy
      auth_migrations:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

  # Трейсинг с помощью Jaeger для observability
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "6831:6831/udp"
      - "16686:16686"
      - "14268:14268"
      - "4317:4317"
      - "4318:4318"
      - "9411:9411"
    restart: unless-stopped
    networks:
      - backend

  # Все тесты проекта (tests/): HTTP-тесты async_api и auth_service
  # + Django-тесты admin_panel (tests/admin_panel/: AuthServiceBackend) —
  # тому нужен сам Django (ORM, тестовая БД в Postgres), поэтому вдобавок к
  # requirements.txt тестов ставим requirements.txt admin_panel и гоняем
  # manage.py test поверх смонтированного исходника admin_panel.
  tests:
    profiles:
      - tests
    image: python:3.12-slim
    container_name: tests
    entrypoint: sh -c "
      pip install -r /tests/requirements.txt -r /admin_panel/requirements.txt
      && pytest /tests -rs --ignore=/tests/admin_panel
      && cd /admin_panel && python manage.py test /tests/admin_panel"
    volumes:
      - ./tests:/tests
      - ./admin_panel:/admin_panel
    environment:
      - PYTHONPATH=/
      - REDIS_HOST=async_api_redis
      - API_HOST=async_api
      - AUTH_API_HOST=auth_service
    env_file:
      - ./.env
    depends_on:
      movie_db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      async_api_redis:
        condition: service_healthy
      async_api:
        condition: service_healthy
      auth_service:
        condition: service_healthy
    networks:
      - backend