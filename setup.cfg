[flake8]
# Базовые настройки
max-line-length = 120
max-complexity = 18

# Увеличенные пороги wemake-python-styleguide
max-cognitive-score = 20
max-cognitive-average = 10
max-returns = 8
max-arguments = 8
max-local-variables = 10
max-expressions = 15
max-module-members = 15
max-methods = 12
max-raises = 5
max-try-body-length = 5
max-imports = 20
max-imported-names = 15
max-awaits = 10
max-asserts = 10

# Глобально игнорируем правила, которые часто мешают в async-коде
extend-ignore =
    WPS476,
    WPS221,
    WPS237,
    WPS218,
    WPS204,
    WPS114,
    WPS118,
    WPS421,
    WPS430,
    WPS229,
    WPS404,
    WPS420,
    WPS121,
    WPS122,
    WPS501,
    WPS504,
    WPS505,
    WPS509,
    WPS602,
    WPS615,
    E402,
    W291,
    W292,
    W293,
    W391,
    E261,
    E302,
    E303,
    F401,
    F811,
    F841,
    W503

# Точечные исключения для тестов
