[flake8]
max-line-length = 88
max-line-length = 120
max-complexity = 14
max-cognitive-complexity = 15

exclude = 
    .git,
    __pycache__,
    */migrations/*,
    */alembic/*,
    */versions/*

per-file-ignores =
    # Миграции Django генерируются автоматически, не трогаем
    */migrations/*.py: WPS,WPS113,E501
    # manage.py — автогенерируемый Django-файл
    manage.py: WPS421,WPS323,WPS226
    # Settings — много констант, это нормально
    config/settings/*.py: WPS226,WPS407,WPS213
    */alembic/versions/*.py: E501

# Разрешённые магические числа
ignore = WPS432

# Отключаем правила, которые противоречат идиомам Django
extend-ignore =
    # WPS412: __init__.py с логикой — стандарт для Django (импорт apps, signals)
    WPS412,
    # WPS407: mutable module constant — Django settings часто mutable (dicts, lists)
    WPS407,
    # WPS300: local folder import — в Django это норма (from .models import ...)
    WPS300,
    # WPS453: shebang mismatch — manage.py от Django имеет shebang по умолчанию
    WPS453,
    # WPS226: string over-use — 'NAME' в Django-choices это нормально
    WPS226,
    # WPS110: wrong variable name — 'data', 'obj', 'result' допустимы в сериализаторах
    WPS110,
    # WPS347: vague import — Q из django.db.models стандартен
    WPS347,
    # E501: line too long — покрывается max-line-length = 120
    E501,
