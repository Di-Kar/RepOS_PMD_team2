[flake8]
# ============================================================
# Базовые настройки
# ============================================================
max-line-length = 120
max-complexity = 100

# ============================================================
# Поднятые пороги wemake-python-styleguide (фактически отключены)
# ============================================================
max-cognitive-score = 100
max-cognitive-average = 100
max-returns = 50
max-arguments = 50
max-local-variables = 50
max-expressions = 100
max-module-members = 100
max-methods = 100
max-raises = 50
max-try-body-length = 100
max-imports = 100
max-imported-names = 100
max-awaits = 100
max-asserts = 100
max-conditions = 50
max-elif-branches = 50
max-function-expressions = 100
max-module-expressions = 100
max-string-usages = 100
max-access-level = 10
max-annotation-complexity = 10
max-jones-score = 100

# ============================================================
# Глобальное отключение всех проблемных WPS-правил
# ============================================================
extend-ignore =
    # Имена и сложность
    WPS100,
    WPS101,
    WPS111,
    WPS114,
    WPS118,
    WPS121,
    WPS122,
    # Локальные переменные и выражения
    WPS201,
    WPS202,
    WPS204,
    WPS210,
    WPS211,
    WPS212,
    WPS213,
    WPS214,
    WPS217,
    WPS218,
    WPS219,
    WPS220,
    WPS221,
    WPS223,
    WPS225,
    WPS229,
    WPS231,
    WPS232,
    WPS234,
    WPS235,
    WPS236,
    WPS237,
    WPS238,
    WPS243,
    # Ключевые слова и конструкции
    WPS301,
    WPS328,
    WPS335,
    WPS336,
    WPS338,
    WPS342,
    WPS358,
    WPS363,
    # Классы и методы
    WPS404,
    WPS410,
    WPS411,
    WPS414,
    WPS420,
    WPS421,
    WPS430,
    WPS431,
    WPS435,
    WPS441,
    WPS446,
    WPS458,
    WPS459,
    WPS462,
    WPS474,
    WPS476,
    # Try/except/finally
    WPS501,
    WPS504,
    WPS505,
    WPS509,
    WPS520,
    WPS529,
    # Getter/setter и прочее
    WPS602,
    WPS615,
    # Стандартные flake8
    C901,
    E261,
    E302,
    E303,
    E402,
    F401,
    F811,
    F824,
    F841,
    W291,
    W292,
    W293,
    W391,
    W503,
    # Шум wemake-стиля (решение команды, вариант А): не исправляется в коде
    # WPS432 — магические числа (коды HTTP-статусов, размеры полей и т.п.)
    WPS432,
    # WPS110 — «неудачные» имена переменных (data, result, item, value)
    WPS110,
    # WPS300 — относительные импорты внутри пакета
    WPS300,
    # WPS407 — мутабельные модульные константы (настройки, списки)
    WPS407,
    # WPS102 — имена файлов миграций с датой
    WPS102,
    # WPS347 — импорты «неясного» имени (F, Q, to_kafka_record)
    WPS347,
    # WPS412 — __init__.py с логикой (пакет настроек split-settings)
    WPS412,
    # WPS453 — shebang без исполняемого бита
    WPS453,
    # WPS115 — константа в верхнем регистре внутри класса (тестовые данные)
    WPS115,
    # WPS527 — не кортеж в аргументе (frozenset({...}) в тестах)
    WPS527,
    # WPS506 — лямбда в тестовых моках
    WPS506,
    # WPS473 — пустые строки в миграциях (сгенерированный код)
    WPS473

# ============================================================
# Исключения для конкретных файлов (на случай, если что-то осталось)
# ============================================================
per-file-ignores =
    __init__.py: F401, WPS410, WPS411
    */__init__.py: F401, WPS410, WPS411
    */migrations/*.py: WPS001, WPS114, WPS226
    */tests/*.py: WPS111, WPS210, WPS231, WPS421, WPS430, WPS459
    conftest.py: WPS111, WPS210, WPS231, WPS421, WPS430, WPS459
    */conftest.py: WPS111, WPS210, WPS231, WPS421, WPS430, WPS459

# ============================================================
# Форматирование
# ============================================================
format = default
show-source = True
statistics = True
count = True

# ============================================================
# Исключения для директорий
# ============================================================
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    env,
    .env,
    build,
    dist,
    *.egg-info,
    .mypy_cache,
    .pytest_cache,
    node_modules,
    # Миграции и сгенерированный код (как в исходной конфигурации команды)
    */migrations/*,
    */alembic/*,
    */versions/*

