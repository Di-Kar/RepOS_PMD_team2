[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    # python-multipart >=0.0.9 держит deprecated-алиас `multipart`, который
    # starlette (через fastapi==0.111.0) всё ещё импортирует по старому имени
    # (formparsers.py) — предупреждение из чужого кода, не из наших сервисов,
    # и ничинить его можно только синхронным бампом fastapi+starlette во всём
    # проекте. Глушим узко, по модулю, а не блэнкетом на весь класс варнинга.
    ignore::PendingDeprecationWarning:starlette.formparsers
pythonpath = .
