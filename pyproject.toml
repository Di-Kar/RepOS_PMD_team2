[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = [
    # Кавычки
    "Q",    
    # Длина строки
    #"E501",  # line too long
    # Пустые строки
    "E3",
    "W391",  # blank line at end of file
]

[tool.ruff.format]
quote-style = "preserve"
line-ending = "lf"
