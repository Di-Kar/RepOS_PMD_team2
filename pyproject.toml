[tool.mypy]
strict = true
ignore_missing_imports = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["Q","E3", "W391"]

[tool.ruff.format]
quote-style = "preserve"
line-ending = "lf"
