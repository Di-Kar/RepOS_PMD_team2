[tool.mypy]
strict = true
ignore_missing_imports = true
show_error_codes = true

# Заставляет mypy учитывать структуру папок, предотвращая конфликт имён "src"
explicit_package_bases = true

# Указываем mypy искать пакеты в этих директориях
mypy_path = "auth_service:analytics_etl"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["Q","E3", "W391"]

[tool.ruff.format]
quote-style = "preserve"
line-ending = "lf"
