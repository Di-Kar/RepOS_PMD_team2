[tool.mypy]
strict = false
ignore_missing_imports = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

exclude = [
    "^tests/",                # Корневая директория tests/
    ".*/tests/",              # Любая вложенная директория с именем tests/
    ".*test_.*\\.py$",        # Файлы, в имени которых есть "test_" (например, test_auth.py)
    ".*_test\\.py$",          # Файлы, заканчивающиеся на "_test.py"
    "conftest\\.py$",         # Файлы конфигурации pytest
    ".*bench_.*\\.py$",
    ".*/migrations/",           # Все папки migrations/
    ".*migrations/.*\\.py$",    # Все файлы в миграция
]

[tool.ruff]
exclude = [
    "**/alembic/**",
    "**/migrations/**",
    "**/versions/**",
    # Конкретные файлы (если миграции лежат в другом месте)
    "**/env.py",
    "**/script.py.mako",
]

# Отключаем E402 только для тестовых файлов
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]
"**/test_*.py" = ["E402"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["Q", "E3", "E501", "B008", "B904", "W391"]

[tool.ruff.format]
quote-style = "preserve"
line-ending = "lf"
